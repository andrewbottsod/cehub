<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CE Hub 2027 — Optometry CE Calendar &amp; License Tracker</title>
<meta name="description" content="Every 2027 optometry CE meeting in one calendar — national, state association, specialty and travel CE — with direct registration links, plus a free multi-state license and CE transcript tracker.">
<meta property="og:title" content="CE Hub 2027 — Optometry CE Calendar">
<meta property="og:description" content="National, state, specialty and destination optometry CE for 2027 with registration links and license tracking.">
<meta name="theme-color" content="#2340c2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Libre+Franklin:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a working planner — sticky masthead with tabs, filter rail, 12-month grid or list, and a favorites rail on the right that becomes a bottom drawer on phones. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#eef1f6; --ink:#12212d; --muted:#5a6977; --line:#d9e0e8;
  --accent:#2340c2; --accent-ink:#ffffff; --accent-soft:#e3e8fb;
  --fluor:#d9f24f; --fluor-ink:#1f2a00;
  --good:#16794f; --warn:#a15c00; --bad:#b3261e;
  --c-national:#2340c2; --c-state:#0d7a63; --c-specialty:#7d46c6; --c-travel:#c25414; --c-school:#a1336f; --c-regional:#2f7aa6; --c-canada:#b03535; --c-industry:#66717e; --c-ophthalmology:#9a6a00; --c-procedures:#5b6b00; --c-online:#0e7490; --c-local:#7c4a1e; --c-staff:#be185d; --c-mission:#0f766e;
  --f-display:"Zilla Slab", Rockwell, "Roboto Slab", Georgia, serif;
  --f-body:"Libre Franklin", "Helvetica Neue", Arial, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --radius:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0c141b; --surface:#131e28; --surface-2:#1a2733; --ink:#e5ecf2; --muted:#93a3b1; --line:#253542;
  --accent:#8299ff; --accent-ink:#0c141b; --accent-soft:#1f2b52; --fluor:#cfe84a; --fluor-ink:#1a2200;
  --good:#5cc895; --warn:#e3a43c; --bad:#ff8a80;
  --c-national:#8299ff; --c-state:#4fc6a7; --c-specialty:#b691f0; --c-travel:#f0915a; --c-school:#e27ab3; --c-regional:#6db7e0; --c-canada:#f07b7b; --c-industry:#a3adb8; --c-ophthalmology:#e3b54f; --c-procedures:#b8cb4d; --c-online:#4fc3dc; --c-local:#d29b6b; --c-staff:#f472b6; --c-mission:#4fd1b5;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0c141b; --surface:#131e28; --surface-2:#1a2733; --ink:#e5ecf2; --muted:#93a3b1; --line:#253542;
  --accent:#8299ff; --accent-ink:#0c141b; --accent-soft:#1f2b52; --fluor:#cfe84a; --fluor-ink:#1a2200;
  --good:#5cc895; --warn:#e3a43c; --bad:#ff8a80;
  --c-national:#8299ff; --c-state:#4fc6a7; --c-specialty:#b691f0; --c-travel:#f0915a; --c-school:#e27ab3; --c-regional:#6db7e0; --c-canada:#f07b7b; --c-industry:#a3adb8; --c-ophthalmology:#e3b54f; --c-procedures:#b8cb4d; --c-online:#4fc3dc; --c-local:#d29b6b; --c-staff:#f472b6; --c-mission:#4fd1b5;
  color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
.acct{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px}
.acct .who{color:var(--muted);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
footer.foot{padding-block:24px 40px;color:var(--muted);font-size:12.5px;display:flex;flex-wrap:wrap;gap:8px 18px;border-top:1px solid var(--line)}
.signin{display:flex;flex-direction:column;gap:10px}
.signin .inp{font-size:15px;padding:10px}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1440px;margin:0 auto}

/* masthead */
header.mast{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.mast-in{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px;padding-block:14px 0}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.05;margin:0;letter-spacing:-.01em}
.brand h1 span{color:var(--accent)}
.stamp{margin-left:auto;font-size:12px;color:var(--muted);text-align:right}
.stamp b{color:var(--ink);font-weight:600}
nav.tabs{display:flex;gap:4px;width:100%;overflow-x:auto;margin-top:6px}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* frame */
.frame{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;padding-block:20px 80px}
@media (max-width:980px){.frame{grid-template-columns:minmax(0,1fr)}}
main{min-width:0;display:flex;flex-direction:column;gap:18px}

/* filters */
.filters{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.frow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.search{flex:1 1 240px;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px}
.filters select,.inp{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 8px;max-width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 10px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted)}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="true"]{color:var(--ink);border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--surface))}
.chip[aria-pressed="false"] .dot{opacity:.35}
label.tog{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);cursor:pointer}
.count{font-size:12.5px;color:var(--muted)}

/* year grid */
.year{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.month{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;min-width:0}
.month h3{margin:0;padding:12px 14px 8px;display:flex;align-items:baseline;gap:8px;font-family:var(--f-display);font-size:20px;font-weight:600}
.month h3 small{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-weight:400;margin-left:auto}
.mlist{list-style:none;margin:0;padding:0 6px 8px;display:flex;flex-direction:column}
.erow{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px;border-radius:8px;cursor:pointer;border-left:3px solid var(--c)}
.erow:hover{background:var(--surface-2)}
.erow .d{font-family:var(--f-mono);font-size:12px;line-height:1.3;color:var(--ink)}
.erow .d small{display:block;color:var(--muted);font-size:10.5px}
.erow .t{min-width:0}
.erow .t b{display:block;font-weight:600;font-size:13.5px;line-height:1.3;overflow-wrap:anywhere}
.erow .t span{display:block;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.erow.tba .d{color:var(--muted)}
.tbahead{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:8px 8px 2px}
.mempty{color:var(--muted);font-size:12.5px;padding:4px 14px 14px}
.star{border:0;background:none;cursor:pointer;font-size:18px;line-height:1;color:var(--muted);padding:2px 4px}
.star[aria-pressed="true"]{color:#e0a100}
.badge{display:inline-block;font-family:var(--f-mono);font-size:10px;font-weight:500;letter-spacing:.06em;padding:1px 6px;border-radius:4px;vertical-align:1px;margin-left:4px;text-transform:uppercase}
.b-new{background:var(--fluor);color:var(--fluor-ink)}
.b-upd{background:var(--accent-soft);color:var(--accent)}
.b-sp{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.b-tba{background:var(--surface-2);color:var(--muted)}
.sponsored{background:color-mix(in srgb,var(--fluor) 14%,var(--surface))}

/* list cards */
.cards{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:var(--radius);padding:14px 16px;display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:14px}
@media (max-width:640px){.card{grid-template-columns:minmax(0,1fr) auto}.card .cdate{grid-column:1/-1;display:flex;gap:8px;align-items:baseline}}
.cdate{font-family:var(--f-mono)}
.cdate .m{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.cdate .dd{font-size:20px;font-weight:500}
.cbody{min-width:0;display:flex;flex-direction:column;gap:4px}
.cbody h4{margin:0;font-family:var(--f-display);font-size:18px;font-weight:600;line-height:1.25;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:12.5px}
.meta b{color:var(--ink);font-weight:600}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600;font-size:13px;text-decoration:none;color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:4px 9px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:default}
.contact{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.contact .sel{user-select:all;color:var(--ink)}
.copy{border:0;background:none;color:var(--accent);cursor:pointer;font-size:12px;padding:0 2px}
.cat{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--c);text-transform:uppercase;letter-spacing:.06em}
.cat::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.sec-h{font-family:var(--f-display);font-size:22px;margin:6px 0 0;font-weight:600}
.note{color:var(--muted);font-size:12.5px;margin:0}

/* sidebar */
aside.favs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 112px);align-self:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;max-height:calc(100vh - 140px)}
.favs h2{font-family:var(--f-display);font-size:20px;margin:0;padding:14px 16px 4px;display:flex;align-items:center;gap:8px}
.favs h2 .close{margin-left:auto;display:none}
.favsum{padding:0 16px 10px;color:var(--muted);font-size:12.5px;border-bottom:1px solid var(--line)}
.favsum b{color:var(--ink)}
.favlist{list-style:none;margin:0;padding:8px;overflow:auto;display:flex;flex-direction:column;gap:2px;flex:1}
.favlist li{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:8px;padding:8px;border-radius:8px;align-items:start}
.favlist li:hover{background:var(--surface-2)}
.favlist .d{font-family:var(--f-mono);font-size:11.5px;line-height:1.3}
.favlist .t{min-width:0;cursor:pointer}
.favlist .t b{display:block;font-size:13px;line-height:1.3;font-weight:600;overflow-wrap:anywhere}
.favlist .t span{font-size:11.5px;color:var(--muted)}
.favlist .x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px;line-height:1}
.favfoot{padding:10px 16px 14px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px}
.favlist li.favempty{display:block;padding:12px 8px;color:var(--muted);font-size:13px}
.fab{display:none}
@media (max-width:980px){
  aside.favs{position:fixed;left:0;right:0;bottom:0;top:auto;max-height:70vh;border-radius:14px 14px 0 0;z-index:40;transform:translateY(105%);transition:transform .25s ease;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  aside.favs.open{transform:none;box-shadow:0 -10px 30px rgba(0,0,0,.18)}
  .favs h2 .close{display:inline-flex}
  .fab{display:inline-flex;position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;box-shadow:0 6px 18px rgba(0,0,0,.2)}
}
@media (prefers-reduced-motion:reduce){aside.favs{transition:none}}

/* tracker */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h3{margin:0;font-family:var(--f-display);font-size:20px;font-weight:600}
.formrow{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.field .inp{min-width:0}
.lic{border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.lichead{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.lichead h4{margin:0;font-family:var(--f-display);font-size:19px;font-weight:600}
.pill{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;letter-spacing:.02em}
.p-good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.p-warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.p-bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.bars{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.bar{display:flex;flex-direction:column;gap:4px;min-width:0}
.bar .lbl{display:flex;justify-content:space-between;gap:8px;font-size:12.5px}
.bar .lbl span:last-child{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.track{height:10px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;display:flex}
.fill{height:100%;background:var(--accent)}
.fill.plan{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--accent) 55%,transparent) 0 4px,transparent 4px 7px)}
.fill.done{background:var(--good)}
.mand{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:13px}
.mand label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--surface-2);font-weight:600;white-space:nowrap}
td.num{font-family:var(--f-mono);text-align:right;white-space:nowrap}
td select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 4px;font-size:12px}
.drop{border:2px dashed var(--line);border-radius:var(--radius);padding:18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:center}
.orglink{background:none;border:0;padding:0;font:inherit;font-weight:700;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px}.orgbar{grid-column:1/-1;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--accent-soft)}#morg{max-width:280px}
.wizard .wstep{display:flex;gap:12px;margin:14px 0 4px}.wizard .wstep.off{opacity:.55}.wnum{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:14px}.wstep.off .wnum{background:var(--line);color:var(--muted)}.wbody{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}.wopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}.wopt{text-align:left;border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;background:var(--surface);cursor:pointer;display:flex;flex-direction:column;gap:3px;color:var(--ink);font:inherit}.wopt:hover{border-color:var(--accent)}.wopt[aria-checked="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}.panel.profile .lichead{align-items:center}.tag{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.copesum{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 10px}.copechip{color:var(--ink);font-size:12px;padding:2px 8px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}.mand li>.note{display:block;padding-left:24px}.mand .note.ok{color:var(--good)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.mapgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;z-index:60;max-width:calc(100% - 32px)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);padding:28px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-size:20px;margin-bottom:4px}

/* dialog */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:0;width:min(640px,calc(100vw - 32px));max-height:calc(100vh - 48px)}
dialog::backdrop{background:rgba(8,14,20,.5)}
.dlg{padding:20px;display:flex;flex-direction:column;gap:10px}
.dlg h2{font-family:var(--f-display);margin:0;font-size:24px;line-height:1.2;text-wrap:balance}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:6px 12px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
.about{max-width:72ch;display:flex;flex-direction:column;gap:10px}
.about h3{font-family:var(--f-display);font-size:20px;margin:10px 0 0}
.about p,.about li{color:var(--ink)}
.log{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.log li{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;font-size:13px}
.suggest{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
</style>
</head>
<body>

<header class="mast">
  <div class="wrap mast-in">
    <div class="brand">
      <h1>CE Hub <span>2027</span></h1>
    </div>
    <div class="stamp" id="stamp">Loading listings…</div>
    <div class="acct" id="acct"></div>
    <nav class="tabs" role="tablist" aria-label="Views">
      <button role="tab" id="tab-tracker" aria-selected="false" data-view="tracker">My licenses &amp; CE</button>
      <button role="tab" id="tab-list" aria-selected="true" data-view="list">All listings</button>
      <button role="tab" id="tab-year" aria-selected="false" data-view="year">Calendar</button>
      <button role="tab" id="tab-missions" aria-selected="false" data-view="missions">Missions</button>
      <button role="tab" id="tab-about" aria-selected="false" data-view="about">Updates &amp; sources</button>
    </nav>
  </div>
</header>

<div class="wrap frame">
  <main id="main">
    <section class="filters" id="filters" aria-label="Filters">
      <div class="frow">
        <input class="search" id="q" type="search" placeholder="Search meetings, cities, organizers…" aria-label="Search">
        <select id="region" aria-label="Location"></select>
        <select id="focus" aria-label="Topic"></select>

/* ---------- filtering ---------- */

function monthOf(e){ if(e.start){ const d=pd(e.start); return d.getFullYear()<YEAR?0:d.getMonth(); } return e.tbaMonth? e.tbaMonth-1 : null; }

const COPE_ID_RX=/\b(\d{3,6})\s?[-–]\s?([A-Z]{2})\b/, COPE_ID_STRICT=/\b(\d{4,6})\s?[-–]\s?([A-Z]{2})\b/;

function copeCodeFromCat(cat){
  const c=String(cat||"").trim(), u=c.toUpperCase(); if(!c) return null; if(COPE_CATS[u]) return u;
  const lc=c.toLowerCase().replace(/&/g,"and").replace(/[^a-z ]/g," ").replace(/\s+/g," ").trim(); if(lc.length<4) return null;

  const s=String(txt||"");
  if(/\bAOA\b[^.]{0,40}\b1-?A\b|Category 1-?A\b/i.test(s)) return "aoa1a";
  if(/\bAOA\b[^.]{0,40}\b1-?B\b|Category 1-?B\b/i.test(s)) return "aoa1b";
  if(/\bAOA\b[^.]{0,40}Cat(egory)?\.?\s?2/i.test(s)) return "aoa2";

function medCalc(lic){
  const r=medRule(lic.state, licKind(lic)); if(!r) return null;
  const end=pd(lic.renewal); if(!end) return {r, noDate:true};
  const start=new Date(end); start.setFullYear(start.getFullYear()-(r.cycleYears||2)); start.setDate(start.getDate()+1);
  const sIso=iso(start), eIso=iso(end);
  const rows=S.transcript.rows.filter(x=>x.date>=sIso && x.date<=eIso);
  let ama1=0, aoa1a=0, cat2=0, cope=0, other=0;
  for(const x of rows){ const h=+x.hours||0, c=rowCredit(x);
    if(c==="ama1"||c==="ama1sa") ama1+=h; else if(c==="aoa1a") aoa1a+=h; else if(c==="aoa1b"||c==="aoa2"||c==="ama2") cat2+=h; else if(c==="cope") cope+=h; else other+=h; }
  const doStrict=r.kind==="do"&&r.hasDoRule;
  const cat1= doStrict? aoa1a : ama1+aoa1a;          // osteopathic boards ask for AOA 1-A specifically
  const rest= doStrict? cat2+ama1 : cat2;
  const total=r.total||0;
  let counted=cat1+rest;
  if(r.cat1Min!=null && r.cat1Min>=total) counted=cat1;
  const t=today();
  const planned=S.events.filter(e=>isFav(e.id) && e.start && e.start>=sIso && e.start<=eIso && pd(e.start)>=t && hasAma(e));

}

}

/* ---------- persistence & accounts ---------- */
let sb=null, pTimer=null, tTimer=null, rTimer=null, chain=Promise.resolve();
function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)||"null"); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
function normProfile(p){ p=p||{}; const o={favorites:[...(p.favorites||[])], licenses:JSON.parse(JSON.stringify(p.licenses||[])), home:p.home||HOME_DEFAULT}; if(p.person) o.person=JSON.parse(JSON.stringify(p.person)); return o; }
function configured(){ return !!(window.supabase && CFG.supabaseUrl && CFG.supabaseAnonKey && !/YOUR[-_]/i.test(CFG.supabaseUrl+CFG.supabaseAnonKey)); }
function queueRemote(){ if(!sb||!S.uid) return; clearTimeout(rTimer); rTimer=setTimeout(()=>{ const row={user_id:S.uid, profile:JSON.parse(JSON.stringify(S.profile)), transcript:{rows:S.transcript.rows}, updated_at:new Date().toISOString()};
  chain=chain.then(async()=>{ const {error}=await sb.from("user_data").upsert(row); if(error) toast("Couldn't sync to your account: "+error.message); }); },300); }
function saveProfile(){ clearTimeout(pTimer); pTimer=setTimeout(()=>{ if(S.uid) queueRemote(); else lsSet("cehub.profile", JSON.parse(JSON.stringify(S.profile))); },300); }
function saveTranscript(){ clearTimeout(tTimer); tTimer=setTimeout(()=>{ if(S.uid) queueRemote(); else lsSet("cehub.transcript", {rows:S.transcript.rows}); },300); }
function loadLocal(){ const p=lsGet("cehub.profile"); S.profile=normProfile(p); const t=lsGet("cehub.transcript"); S.transcript={rows:(t&&t.rows)||[]}; }

async function loadRemote(){
  const {data,error}=await sb.from("user_data").select("profile,transcript").eq("user_id",S.uid).maybeSingle();
  if(error){ toast("Couldn't load your saved data: "+error.message); return; }
  const lp=lsGet("cehub.profile"), lt=lsGet("cehub.transcript");
  if(data){ S.profile=normProfile(data.profile); S.transcript={rows:(data.transcript&&data.transcript.rows)||[]}; }
  else { S.profile=normProfile(null); S.transcript={rows:[]}; }
  let merged=!data;
  if(lp){ for(const id of (lp.favorites||[])) if(!S.profile.favorites.includes(id)){ S.profile.favorites.push(id); merged=true; }
    for(const l of (lp.licenses||[])) if(!S.profile.licenses.some(x=>x.state===l.state)){ S.profile.licenses.push(l); merged=true; }
    if(!S.profile.home && lp.home){ S.profile.home=lp.home; merged=true; }
    if(!S.profile.person && lp.person){ S.profile.person=lp.person; merged=true; } }
  if(lt&&lt.rows){ const key=r=>r.date+"|"+String(r.courseId||r.title).toLowerCase()+"|"+r.hours; const seen=new Set(S.transcript.rows.map(key)); for(const r of lt.rows) if(!seen.has(key(r))){ S.transcript.rows.push(r); seen.add(key(r)); merged=true; } }
  lsDel("cehub.profile"); lsDel("cehub.transcript");
  if(merged) queueRemote();
}
async function applySession(session){
  const uid=session?.user?.id||null; if(uid===S.uid) return;
  S.uid=uid; S.email=session?.user?.email||"";
  if(uid){ S.personalMode="account"; await loadRemote(); }
  else { S.personalMode="local"; loadLocal(); }
  renderAcct(); renderAll();
}
function renderAcct(){
  const a=$("#acct"); if(!sb){ a.replaceChildren(); return; }
  if(S.uid) a.replaceChildren(el("span",{class:"who",title:S.email,text:S.email}), el("button",{class:"btn small",type:"button",onclick:async()=>{ await sb.auth.signOut(); toast("Signed out"); }},"Sign out"));
  else a.replaceChildren(el("button",{class:"btn small primary",type:"button",onclick:openSignIn},"Sign in"));
}
function openSignIn(){
  const body=$("#dlgBody"); const email=el("input",{class:"inp",type:"email",id:"signinEmail",placeholder:"you@practice.com",autocomplete:"email",required:true});
  const msg=el("p",{class:"note",text:"We'll email you a one-time sign-in link — no password. Your licenses, transcript and favorites are then saved privately to your account."});
  const go=el("button",{class:"btn primary",type:"submit"},"Email me a sign-in link");
  const form=el("form",{class:"signin",onsubmit:async ev=>{ ev.preventDefault(); const v=email.value.trim(); if(!/^\S+@\S+\.\S+$/.test(v)){ toast("Enter a valid email address"); return; } go.disabled=true;
      const {error}=await sb.auth.signInWithOtp({email:v, options:{emailRedirectTo: location.origin+location.pathname}});
      go.disabled=false; if(error){ msg.textContent="Couldn't send the link: "+error.message; return; }
      form.replaceChildren(el("h2",{text:"Check your email"}), el("p",{text:"We sent a sign-in link to "+v+". Open it on this device to finish signing in. It can take a minute to arrive — check spam if it doesn't."}), el("div",{class:"actions"}, el("button",{class:"btn",type:"button",onclick:()=>$("#dlg").close()},"Close"))); }},
    el("h2",{text:"Sign in to CE Hub"}), msg, el("label",{class:"field"},"Email",email), el("div",{class:"actions"}, go, el("button",{class:"btn ghost",type:"button",onclick:()=>$("#dlg").close()},"Cancel")));
  body.replaceChildren(form); const d=$("#dlg"); if(!d.open) d.showModal(); setTimeout(()=>email.focus(),50);
}
async function initAuth(){
  loadLocal();
  if(!configured()) return;
  try{ sb=window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey); }catch(e){ console.warn(e); sb=null; return; }
  renderAcct();
  const {data}=await sb.auth.getSession(); await applySession(data?.session||null);
  sb.auth.onAuthStateChange((_evt, session)=>{ setTimeout(()=>applySession(session),0); });
}
async function boot(){
  buildFilters();
  setView("list");
  try{
    const [ev,req,meta]=await Promise.all(["events","requirements","meta"].map(n=>fetch("data/"+n+".json",{cache:"no-cache"}).then(r=>{ if(!r.ok) throw new Error(n+" "+r.status); return r.json(); })));
    S.events=Array.isArray(ev)? ev : []; S.req=req; S.meta=meta; S.loaded=true; S.dbOk=true;
    fetch("data/requirements-md.json",{cache:"no-cache"}).then(r=>r.ok?r.json():null).then(j=>{ S.reqMd=j; renderAll(); }).catch(()=>{});
    fetch("data/missions.json",{cache:"no-cache"}).then(r=>r.ok?r.json():[]).then(ms=>{ S.missions=Array.isArray(ms)?ms:[]; renderAll(); }).catch(()=>{});
  }catch(e){ console.warn(e); S.dbOk=false; }
  renderAll();
  await initAuth();
  renderAll();
}
boot();
})();
